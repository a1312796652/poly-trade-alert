Name: Polymarket Order Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    # 赋予仓库读写权限，允许脚本自动提交 sent_history.txt
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Monitor
        env:
          POLYMARKET_ADDRESS: ${{ secrets.POLYMARKET_ADDRESS }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 注入内置 Token 用于自动同步历史文件
        run: python monitor.py
